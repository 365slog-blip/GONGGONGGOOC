<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>우리의 기록 💑</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--bg4:#282828;
  --text:#f0f0f0;--text2:#a0a0a0;--text3:#505050;
  --border:#2a2a2a;--border2:#383838;
  --accent:#ff6b6b;--gold:#f5c842;--card:#161616;
}
.light{
  --bg:#fafaf8;--bg2:#f5f4f0;--bg3:#eeedea;--bg4:#e5e4e0;
  --text:#1a1a1a;--text2:#666;--text3:#aaa;
  --border:#e0dedd;--border2:#ccc;--card:#fff;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
body{overflow:hidden}

/* LOCK */
#lock-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;gap:14px;padding:40px}
.lock-heart{font-size:52px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.lock-title{font-size:28px;font-weight:700;letter-spacing:-.5px}
.lock-sub{font-size:13px;color:var(--text2)}
.lock-input{background:var(--bg3);border:0.5px solid var(--border2);border-radius:14px;padding:14px 20px;font-size:18px;color:var(--text);width:220px;text-align:center;letter-spacing:6px;outline:none;font-family:inherit;margin-top:8px}
.lock-input:focus{border-color:var(--accent)}
.lock-btn{background:var(--accent);color:#fff;border:none;border-radius:14px;padding:14px 48px;font-size:15px;font-weight:600;cursor:pointer;width:220px}
.lock-err{color:var(--accent);font-size:13px;height:16px;text-align:center}

/* APP */
#app{height:100%;display:none;flex-direction:column}

/* HEADER */
.hdr{padding:50px 18px 14px;background:var(--bg);border-bottom:0.5px solid var(--border);flex-shrink:0;position:relative;text-align:center}
.dday-label{font-size:11px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.dday-num{font-size:38px;font-weight:800;letter-spacing:-1.5px;color:var(--accent);line-height:1}
.dday-since{font-size:11px;color:var(--text3);margin-top:3px}
.hdr-btns{position:absolute;top:50px;right:14px}
.hdr-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;font-size:17px;color:var(--text2)}

/* TABS */
.tabs{display:flex;background:var(--bg2);border-bottom:0.5px solid var(--border);flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:70px;padding:10px 4px 8px;border:none;background:none;cursor:pointer;font-size:11px;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s;position:relative;white-space:nowrap}
.tab.on{color:var(--accent)}
.tab.on::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--accent);border-radius:2px}
.tab-icon{font-size:18px}

/* CONTENT */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tab-pane{display:none}
.tab-pane.on{display:block}

/* PANE HEADER */
.pane-hdr{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:0.5px solid var(--border)}
.pane-title{font-size:16px;font-weight:600}
.add-btn{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer}

/* RANKING */
.ranking-wrap{padding:12px 16px;border-bottom:0.5px solid var(--border);background:var(--bg2)}
.ranking-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.ranking-list{display:flex;flex-direction:column;gap:6px}
.rank-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg);border:0.5px solid var(--border)}
.rank-item.rank-1{border-color:var(--gold);background:rgba(245,200,66,.06)}
.rank-item.rank-2{border-color:#c0c0c0;background:rgba(192,192,192,.04)}
.rank-item.rank-3{border-color:#cd7f32;background:rgba(205,127,50,.04)}
.rank-num{font-size:16px;font-weight:800;width:24px;text-align:center}
.rank-1 .rank-num{color:var(--gold)}
.rank-2 .rank-num{color:#c0c0c0}
.rank-3 .rank-num{color:#cd7f32}
.rank-name{flex:1;font-size:13px;font-weight:500}
.rank-score{font-size:12px;color:var(--accent);font-weight:600}
.rank-loc{font-size:11px;color:var(--text3)}

/* LIST TABLE */
.list-wrap{padding-bottom:100px}
.list-table{width:100%;border-collapse:collapse}
.list-table th{padding:10px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;border-bottom:0.5px solid var(--border);background:var(--bg2);white-space:nowrap}
.list-table td{padding:10px;font-size:13px;border-bottom:0.5px solid var(--border);vertical-align:middle}
.list-row{cursor:default}
.list-row:hover td{background:var(--bg2)}
.list-row.highlight td{background:rgba(245,200,66,.05)}
.list-row.highlight td:first-child{border-left:3px solid var(--gold)}
.list-name{font-weight:500;color:var(--accent);cursor:pointer}
.list-name:hover{text-decoration:underline}
.list-stars{color:var(--accent);font-size:12px;white-space:nowrap}
.list-avg{font-weight:700;color:var(--gold)}
.row-actions{display:flex;gap:4px}
.row-btn{border:none;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:11px;color:var(--text3)}
.row-btn:hover{background:var(--bg3);color:var(--text)}
.row-btn.del:hover{color:var(--accent)}

/* INLINE EDIT */
.inline-input{background:var(--bg3);border:0.5px solid var(--accent);border-radius:6px;padding:4px 6px;font-size:12px;color:var(--text);font-family:inherit;outline:none;width:100%;min-width:60px}
.inline-save{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;white-space:nowrap}
.inline-cancel{background:var(--bg3);color:var(--text2);border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer}

/* GALLERY */
.gallery-wrap{padding:12px 16px 100px}
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}
.gcard{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;border:0.5px solid var(--border);transition:transform .12s}
.gcard:active{transform:scale(.96)}
.gcard-img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg3);display:block}
.gcard-ph{width:100%;aspect-ratio:4/3;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:26px}
.gcard-body{padding:8px}
.gcard-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.gcard-sub{font-size:10px;color:var(--text3)}
.gcard-score{font-size:11px;color:var(--accent);margin-top:2px}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;grid-column:1/-1;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:8px}
.empty-txt{font-size:14px;color:var(--text2)}

/* DETAIL VIEW */
.dview{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dview.on{display:block}
.dview-hdr{padding:50px 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);border-bottom:0.5px solid var(--border);z-index:10}
.back-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:26px;padding:2px 6px;line-height:1}
.dview-title{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-btn{background:none;border:0.5px solid var(--border2);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap}
.edit-btn:hover{background:var(--bg3);color:var(--text)}
.dhero{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;cursor:pointer}
.dph{width:100%;aspect-ratio:16/9;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:52px}
.dbody{padding:16px 16px 60px}
.dtitle{font-size:20px;font-weight:700;letter-spacing:-.5px;margin-bottom:12px}
.dprops{background:var(--bg2);border-radius:12px;border:0.5px solid var(--border);padding:12px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.dprop{display:flex;gap:10px;font-size:13px}
.dprop-k{color:var(--text3);width:65px;flex-shrink:0;font-size:11px;padding-top:1px}
.dprop-v{color:var(--text);flex:1;line-height:1.5}
.dsec{margin-bottom:16px}
.dsec-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.dsec-txt{font-size:14px;line-height:1.75;color:var(--text)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:8px;overflow:hidden}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.dtags{display:flex;gap:6px;flex-wrap:wrap}
.dtag{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--bg3);color:var(--text2)}

/* FORM VIEW */
.fview{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fview.on{display:block}
.fview-hdr{padding:50px 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);border-bottom:0.5px solid var(--border);z-index:10}
.fview-title{font-size:15px;font-weight:600;flex:1}
.fsave-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.fbody{padding:16px 16px 100px}
.fg{margin-bottom:16px}
.flabel{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;display:block}
.finput{width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:11px 13px;font-size:15px;color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none}
.finput:focus{border-color:var(--accent)}
.ftarea{resize:none;min-height:80px;line-height:1.6}
.fselect{width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:11px 13px;font-size:15px;color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none}

/* STAR DISPLAY (숫자입력→별표시) */
.star-input-wrap{display:flex;align-items:center;gap:10px}
.star-display{font-size:22px;letter-spacing:2px;color:var(--accent);min-width:110px}
.star-num-input{background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--text);font-family:inherit;outline:none;width:70px;text-align:center;-webkit-appearance:none}
.star-num-input:focus{border-color:var(--accent)}
.star-hint{font-size:11px;color:var(--text3);margin-top:4px}

/* IMG */
.img-drop{border:1.5px dashed var(--border2);border-radius:10px;padding:20px;text-align:center;cursor:pointer;color:var(--text3)}
.img-drop:active{border-color:var(--accent)}
.img-previews{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
@media(max-width:600px){.img-previews{grid-template-columns:repeat(3,1fr)}}
.ipreview{position:relative;aspect-ratio:1;border-radius:7px;overflow:hidden}
.ipreview img{width:100%;height:100%;object-fit:cover;display:block}
.ipreview-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* LIGHTBOX */
.lbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:500;align-items:center;justify-content:center;cursor:zoom-out}
.lbox.on{display:flex}
.lbox img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:6px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.on{opacity:1}

/* LOADING */
.loading{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:400;flex-direction:column;gap:10px}
.loading-spinner{width:34px;height:34px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:12px;color:#fff;background:rgba(0,0,0,.7);padding:6px 14px;border-radius:20px}

input[type=file]{display:none}
::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock-screen">
  <div class="lock-heart">💑</div>
  <div class="lock-title">우리의 기록</div>
  <div class="lock-sub">소중한 순간들을 담아요</div>
  <input class="lock-input" type="password" id="lock-pw" placeholder="••••" maxlength="10" onkeydown="if(event.key==='Enter')tryLogin()">
  <div class="lock-err" id="lock-err"></div>
  <button class="lock-btn" onclick="tryLogin()">입장하기</button>
</div>

<!-- APP -->
<div id="app">
  <div class="hdr">
    <div class="dday-label">함께한 지</div>
    <div class="dday-num" id="dday">D+0</div>
    <div class="dday-since">2021.10.09 ~</div>
    <div class="hdr-btns">
      <button class="hdr-btn" onclick="toggleTheme()" id="theme-btn">☀️</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" id="tab-matzip" onclick="goTab('matzip')">
      <span class="tab-icon">🍜</span><span>맛집</span>
    </button>
    <button class="tab" id="tab-gourmet" onclick="goTab('gourmet')">
      <span class="tab-icon">✨</span><span>고-급</span>
    </button>
    <button class="tab" id="tab-date" onclick="goTab('date')">
      <span class="tab-icon">📍</span><span>데이트</span>
    </button>
    <button class="tab" id="tab-movie" onclick="goTab('movie')">
      <span class="tab-icon">🎬</span><span>영화</span>
    </button>
  </div>

  <div class="content">
    <!-- 맛집: 랭킹 + 리스트 -->
    <div class="tab-pane on" id="pane-matzip">
      <div class="pane-hdr">
        <div class="pane-title">맛집 기록</div>
        <button class="add-btn" onclick="openForm('matzip')">+ 추가</button>
      </div>
      <div class="ranking-wrap" id="ranking-wrap">
        <div class="ranking-title">🏆 TOP 랭킹</div>
        <div class="ranking-list" id="ranking-list"></div>
      </div>
      <div class="list-wrap">
        <table class="list-table">
          <thead><tr>
            <th>가게명</th><th>장소</th><th>공슐랭</th><th>하슐랭</th><th>평균</th><th>메뉴</th><th></th>
          </tr></thead>
          <tbody id="tbody-matzip"></tbody>
        </table>
      </div>
    </div>

    <!-- 고-급: 갤러리 -->
    <div class="tab-pane" id="pane-gourmet">
      <div class="pane-hdr">
        <div class="pane-title">고-급 기록</div>
        <button class="add-btn" onclick="openForm('gourmet')">+ 추가</button>
      </div>
      <div class="gallery-wrap">
        <div class="gallery-grid" id="grid-gourmet"></div>
      </div>
    </div>

    <!-- 데이트: 갤러리 -->
    <div class="tab-pane" id="pane-date">
      <div class="pane-hdr">
        <div class="pane-title">데이트 기록</div>
        <button class="add-btn" onclick="openForm('date')">+ 추가</button>
      </div>
      <div class="gallery-wrap">
        <div class="gallery-grid" id="grid-date"></div>
      </div>
    </div>

    <!-- 영화: 갤러리 -->
    <div class="tab-pane" id="pane-movie">
      <div class="pane-hdr">
        <div class="pane-title">영화 기록</div>
        <button class="add-btn" onclick="openForm('movie')">+ 추가</button>
      </div>
      <div class="gallery-wrap">
        <div class="gallery-grid" id="grid-movie"></div>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL VIEW -->
<div class="dview" id="dview-detail">
  <div class="dview-hdr">
    <button class="back-btn" onclick="closeDetail()">‹</button>
    <div class="dview-title" id="dview-title"></div>
    <button class="edit-btn" onclick="editCurrent()">편집</button>
  </div>
  <div id="dview-body"></div>
</div>

<!-- FORM VIEW -->
<div class="fview" id="fview">
  <div class="fview-hdr">
    <button class="back-btn" onclick="closeForm()">‹</button>
    <div class="fview-title" id="fview-title">새 기록</div>
    <button class="fsave-btn" onclick="saveRecord()">저장</button>
  </div>
  <div class="fbody" id="fbody"></div>
</div>

<!-- LIGHTBOX -->
<div class="lbox" id="lbox" onclick="this.classList.remove('on')">
  <img id="lbox-img" src="" alt="">
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept="image/*" multiple onchange="onFiles(event)">

<script>
const PW = '1009';
const SHEET_ID = '1zmvSHTIKPIvuTdgyi4UnHDxqyuhBI_7IAyckAkxqXA8';
const API_KEY = 'AIzaSyBUtEVNLyx4LBp4L8mZixN8_3Io71haDlM';
const CLIENT_ID = '616148935874-0b5ssnkeg245jl2phfqovlfg28scbqq3.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';
const START = new Date('2021-10-09');
const SHEETS = { matzip:'맛집 기본', gourmet:'맛집 상세', date:'데이트_기본', dateDetail:'데이트_상세', movie:'영화' };

let db = { matzip:[], gourmet:[], date:[], dateDetail:[], movie:[] };
let curType = 'matzip';
let curDetail = null;
let curDetailType = null;
let editRowIndex = null;
let imgs = [];
let isLight = false;
let tokenClient, gapiLoaded=false, gisLoaded=false, authed=false;

// LOCK
function tryLogin() {
  if (document.getElementById('lock-pw').value === PW) {
    document.getElementById('lock-screen').style.display = 'none';
    const app = document.getElementById('app');
    app.style.display = 'flex'; app.style.flexDirection = 'column';
    initDday(); initGapi();
  } else {
    document.getElementById('lock-err').textContent = '비밀번호가 틀렸어요 💔';
    document.getElementById('lock-pw').value = '';
    setTimeout(() => document.getElementById('lock-err').textContent = '', 2000);
  }
}
function initDday() {
  document.getElementById('dday').textContent = 'D+' + Math.floor((new Date()-START)/86400000).toLocaleString();
}
function toggleTheme() {
  isLight = !isLight;
  document.body.classList.toggle('light', isLight);
  document.getElementById('theme-btn').textContent = isLight ? '🌙' : '☀️';
}
function goTab(t) {
  curType = t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.tab-pane').forEach(el=>el.classList.remove('on'));
  document.getElementById('tab-'+t).classList.add('on');
  document.getElementById('pane-'+t).classList.add('on');
}

// GAPI
function initGapi() {
  const s1 = document.createElement('script');
  s1.src = 'https://apis.google.com/js/api.js';
  s1.onload = () => gapi.load('client', async () => {
    await gapi.client.init({ apiKey: API_KEY, discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4'] });
    gapiLoaded = true; maybeLoad();
  });
  document.body.appendChild(s1);
  const s2 = document.createElement('script');
  s2.src = 'https://accounts.google.com/gsi/client';
  s2.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: r => { if(!r.error){ authed=true; loadAll(); } }
    });
    gisLoaded = true; maybeLoad();
  };
  document.body.appendChild(s2);
}
function maybeLoad() {
  if (!gapiLoaded||!gisLoaded) return;
  if (gapi.client.getToken()) { authed=true; loadAll(); }
  else tokenClient.requestAccessToken({prompt:'consent'});
}

// SHEET OPS
async function loadAll() {
  showLoading(true);
  try {
    await Promise.all(Object.entries(SHEETS).map(([k,v]) => loadSheet(k,v)));
    // 데이트 상세 merge
    db['dateDetail'] = db['dateDetail'] || [];
    renderAll();
  } catch(e) { toast('로드 실패: '+e.message); }
  showLoading(false);
}
async function loadSheet(key, name) {
  try {
    const res = await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SHEET_ID, range:name});
    const rows = res.result.values||[];
    if (!rows.length) return;
    const hdrs = rows[0];
    db[key] = rows.slice(1).map((row,i) => {
      const o = {_row:i+2};
      hdrs.forEach((h,j) => o[h]=row[j]||'');
      return o;
    }).filter(o => Object.keys(o).some(k=>k!=='_row'&&o[k]));
  } catch(e) { console.log('load err:',name,e); }
}
async function appendRow(name, vals) {
  await gapi.client.sheets.spreadsheets.values.append({
    spreadsheetId:SHEET_ID, range:name, valueInputOption:'USER_ENTERED',
    resource:{values:[vals]}
  });
}
async function updateRow(name, row, vals) {
  await gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId:SHEET_ID, range:`${name}!A${row}:Z${row}`, valueInputOption:'USER_ENTERED',
    resource:{values:[vals]}
  });
}
async function deleteRow(name, row) {
  const sid = await getSheetId(name);
  await gapi.client.sheets.spreadsheets.batchUpdate({
    spreadsheetId:SHEET_ID,
    resource:{requests:[{deleteDimension:{range:{sheetId:sid,dimension:'ROWS',startIndex:row-1,endIndex:row}}}]}
  });
}
async function getSheetId(name) {
  const res = await gapi.client.sheets.spreadsheets.get({spreadsheetId:SHEET_ID});
  const sheet = res.result.sheets.find(s=>s.properties.title===name);
  return sheet ? sheet.properties.sheetId : 0;
}

// RENDER
function renderAll() {
  renderMatzipList();
  renderGallery('gourmet');
  renderGallery('date');
  renderGallery('movie');
}

function avg(a,b) {
  const na=parseFloat(a)||0, nb=parseFloat(b)||0;
  if(!na&&!nb) return 0;
  if(!na) return nb;
  if(!nb) return na;
  return (na+nb)/2;
}

function renderMatzipList() {
  // 랭킹
  const sorted = [...db.matzip].map(i=>({...i,_avg:avg(i.공슐랭,i.하슐랭)})).sort((a,b)=>b._avg-a._avg);
  const top3 = sorted.slice(0,3).filter(i=>i._avg>0);
  const rList = document.getElementById('ranking-list');
  if (!top3.length) {
    document.getElementById('ranking-wrap').style.display='none';
  } else {
    document.getElementById('ranking-wrap').style.display='block';
    rList.innerHTML = top3.map((item,i) => `
      <div class="rank-item rank-${i+1}">
        <div class="rank-num">${['🥇','🥈','🥉'][i]}</div>
        <div class="rank-name">${esc(item.가게명)}</div>
        <div class="rank-loc">${esc(item.장소)}</div>
        <div class="rank-score">★ ${item._avg.toFixed(1)}</div>
      </div>`).join('');
  }

  // 테이블
  const tbody = document.getElementById('tbody-matzip');
  if (!db.matzip.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text3)">
      <div style="font-size:36px;margin-bottom:8px">🍜</div>맛집을 추가해보세요!</td></tr>`;
    return;
  }
  const maxAvg = Math.max(...db.matzip.map(i=>avg(i.공슐랭,i.하슐랭)));
  tbody.innerHTML = db.matzip.map(item => {
    const a = avg(item.공슐랭,item.하슐랭);
    const isTop = a>0 && a===maxAvg;
    return `<tr class="list-row ${isTop?'highlight':''}" id="row-${item._row}">
      <td><span class="list-name" onclick="openMatzipDetail('${esc(item.가게명)}')">${esc(item.가게명)}</span>${isTop?'&nbsp;⭐':''}</td>
      <td style="color:var(--text2);font-size:12px">${esc(item.장소)}</td>
      <td class="list-stars">${starStr(item.공슐랭)}</td>
      <td class="list-stars">${starStr(item.하슐랭)}</td>
      <td class="list-avg">${a>0?a.toFixed(1):'-'}</td>
      <td style="color:var(--text2);font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(item.메뉴)}</td>
      <td>
        <div class="row-actions">
          <button class="row-btn" onclick="inlineEdit(${item._row})">✏️</button>
          <button class="row-btn del" onclick="confirmDelete('matzip',${item._row})">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function starStr(score) {
  if (!score || score==='-') return '-';
  const n = parseFloat(score);
  if (isNaN(n)) return '-';
  const full=Math.floor(n), half=n%1>=0.5?1:0, empty=5-full-half;
  return '★'.repeat(full)+(half?'½':'')+'☆'.repeat(empty)+` ${n}`;
}

function renderGallery(type) {
  const grid = document.getElementById('grid-'+type);
  const items = db[type];
  const icons = {gourmet:'🍽️',date:'📸',movie:'🎬'};
  const txts = {gourmet:'고급 식당을 추가해보세요!',date:'데이트를 기록해보세요!',movie:'영화를 기록해보세요!'};
  if (!items.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">${icons[type]}</div><div class="empty-txt">${txts[type]}</div></div>`;
    return;
  }
  grid.innerHTML = items.map(item => {
    const name = type==='movie' ? item.영화명 : type==='gourmet' ? item.가게명 : item.장소;
    const sub = type==='movie' ? item.날짜 : type==='gourmet' ? (item.날짜+(item.가격?' · '+item.가격:'')) : (item.날짜+(item.구분?' · '+item.구분:''));
    const score = type==='movie' ? avg(item.공슐랭,item.하슐랭) : 0;
    const imgSrc = item.대표이미지||'';
    const imgEl = imgSrc ? `<img class="gcard-img" src="${imgSrc}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : '';
    const ph = `<div class="gcard-ph" ${imgSrc?'style="display:none"':''}>${icons[type]}</div>`;
    return `<div class="gcard" onclick="openDetail('${type}',${item._row})">
      ${imgEl}${ph}
      <div class="gcard-body">
        <div class="gcard-name">${esc(name)}</div>
        <div class="gcard-sub">${esc(sub)}</div>
        ${score>0?`<div class="gcard-score">★ ${score.toFixed(1)}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// DETAIL
function openMatzipDetail(name) {
  const item = db.gourmet.find(i=>i.가게명===name);
  const basic = db.matzip.find(i=>i.가게명===name);
  if (!item && basic) {
    // 상세 없으면 기본 정보 보여주고 상세 추가 유도
    curDetail = basic; curDetailType = 'matzip-detail-new';
    showDetail({가게명:name, _row:basic._row}, 'matzip-detail-new');
    return;
  }
  if (item) { curDetail=item; curDetailType='gourmet'; showDetail(item,'gourmet'); }
}

function openDetail(type, rowIndex) {
  const item = db[type].find(i=>i._row===rowIndex);
  if (!item) return;
  curDetail=item; curDetailType=type;
  // 데이트면 상세 시트에서 사진/기록 병합
  if (type==='date') {
    const detail = (db['dateDetail']||[]).find(d=>d.장소===item.장소&&d.날짜===item.날짜);
    const merged = {...item};
    if (detail) {
      for(let i=1;i<=15;i++) if(detail['사진'+i]) merged['사진'+i]=detail['사진'+i];
      if(detail.데이트기록) merged.데이트기록=detail.데이트기록;
      if(detail.대표이미지&&!merged.대표이미지) merged.대표이미지=detail.대표이미지;
    }
    showDetail(merged, type);
    return;
  }
  showDetail(item, type);
}

function showDetail(item, type) {
  const name = type==='movie'?item.영화명:type==='date'?item.장소:item.가게명;
  document.getElementById('dview-title').textContent = name||'';
  const imgSrc = item.대표이미지||'';
  const imgEl = imgSrc?`<img class="dhero" src="${imgSrc}" onclick="openLbox('${imgSrc}')" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:'' ;
  const ph = `<div class="dph" ${imgSrc?'style="display:none"':''}>${type==='movie'?'🎬':type==='date'?'📸':'🍽️'}</div>`;
  let html = imgEl+ph+`<div class="dbody"><div class="dtitle">${esc(name)}</div><div class="dprops">`;
  if (type==='gourmet'||type==='matzip-detail-new') {
    if (item.날짜) html+=prop('날짜',item.날짜);
    if (item.가격) html+=prop('가격',item.가격);
    if (item.해시태그) html+=prop('태그',item.해시태그);
    if (item.메뉴상세) html+=prop('메뉴',item.메뉴상세);
    const basic = db.matzip.find(i=>i.가게명===item.가게명);
    if (basic?.공슐랭) html+=prop('공슐랭','★ '+basic.공슐랭,true);
    if (basic?.하슐랭) html+=prop('하슐랭','★ '+basic.하슐랭,true);
  }
  if (type==='date') {
    if (item.날짜) html+=prop('날짜',item.날짜);
    if (item.구분) html+=prop('구분',item.구분);
    if (item.한줄평) html+=prop('한줄평',item.한줄평);
  }
  if (type==='date'&&item.데이트기록) html+=sec('데이트 기록',item.데이트기록);
  if (type==='movie') {
    if (item.날짜) html+=prop('날짜',item.날짜);
    if (item.공슐랭) html+=prop('공슐랭','★ '+item.공슐랭,true);
    if (item.하슐랭) html+=prop('하슐랭','★ '+item.하슐랭,true);
    if (item.한줄평) html+=prop('한줄평',item.한줄평);
  }
  html+=`</div>`;
  if (type==='gourmet'&&item.메모) html+=sec('메모',item.메모);
  if (type==='date') {
    if (item.했던것) html+=sec('했던 것',item.했던것);
    if (item.못한것) html+=sec('못 한 것',item.못한것);
    if (item.다음에갈곳) html+=sec('다음에 갈 곳',item.다음에갈곳);
  }
  // 사진
  const photos=[];
  for(let i=1;i<=15;i++) if(item['사진'+i]) photos.push(item['사진'+i]);
  if(photos.length) html+=`<div class="dsec"><div class="dsec-title">사진</div>
    <div class="photo-grid">${photos.map(p=>`<img src="${p}" onclick="openLbox('${p}')" loading="lazy" onerror="this.style.display='none'">`).join('')}</div></div>`;

  if (type==='matzip-detail-new') {
    html+=`<div style="margin-top:16px"><button class="add-btn" style="width:100%;padding:12px;border-radius:10px;font-size:14px" onclick="closeDetail();openForm('gourmet',null,'${esc(item.가게명)}')">+ 상세 기록 추가하기</button></div>`;
  }
  html+=`</div>`;
  document.getElementById('dview-body').innerHTML=html;
  document.getElementById('dview-detail').classList.add('on');
}

function prop(k,v,accent=false) {
  return `<div class="dprop"><span class="dprop-k">${k}</span><span class="dprop-v"${accent?' style="color:var(--accent)"':''}>${esc(v)}</span></div>`;
}
function sec(title,content) {
  return `<div class="dsec"><div class="dsec-title">${title}</div><div class="dsec-txt">${esc(content).replace(/\n/g,'<br>')}</div></div>`;

function editCurrent() {

function fta(key,ph,val='') {

    <textarea class="finput ftarea" id="f-${key}" placeholder="${ph}">${val||''}</textarea></div>`;
}
function fstar(key,label,val='') {
  return `<div class="fg"><label class="flabel">${label}</label>
    <div class="star-input-wrap">
      <input class="star-num-input" id="f-${key}" type="number" min="0" max="10" step="0.5" value="${val||''}" placeholder="0~10" oninput="updateStarDisplay('${key}',this.value)">
      <div class="star-display" id="sd-${key}">${val?numToStars(parseFloat(val)):'☆☆☆☆☆'}</div>
    </div>
    <div class="star-hint">숫자 입력 (0.5 단위, 최대 10점)</div>
  </div>`;
}
function fimgs() {
  return `<div class="fg"><label class="flabel">사진 (최대 15장)</label>

function numToStars(n) {
  if (isNaN(n)||n<=0) return '☆☆☆☆☆';
  const score = Math.min(10,Math.max(0,n));
  const halfScore = score/2;
  const full=Math.floor(halfScore), half=halfScore%1>=0.5?1:0, empty=5-full-half;
  return '★'.repeat(full)+(half?'½':'')+'☆'.repeat(empty);
}
function updateStarDisplay(key,val) {
  const el=document.getElementById('sd-'+key);
  if(el) el.textContent=numToStars(parseFloat(val));
}
function updateStarDisplays() {}

function onFiles(e) {
  const files=Array.from(e.target.files);
  files.slice(0,15-imgs.length).forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{imgs.push(ev.target.result);renderPreviews();};
    r.readAsDataURL(f);
  });
  e.target.value='';
}
function renderPreviews() {

    <button class="ipreview-del" onclick="removeImg(${i})">×</button></div>`).join('');
}
function removeImg(i){imgs.splice(i,1);renderPreviews();}
function val(id){const el=document.getElementById(id);return el?el.value.trim():'';}

// DRIVE UPLOAD
async function uploadImg(base64) {
  if(!base64.startsWith('data:')) return base64;
  try {
    const blob=await fetch(base64).then(r=>r.blob());
    const meta={name:'img_'+Date.now()+'.jpg',mimeType:'image/jpeg'};
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
    form.append('file',blob);
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
      method:'POST',
      headers:{Authorization:'Bearer '+gapi.client.getToken().access_token},
      body:form
    });
    const data=await res.json();
    await fetch('https://www.googleapis.com/drive/v3/files/'+data.id+'/permissions',{
      method:'POST',
      headers:{Authorization:'Bearer '+gapi.client.getToken().access_token,'Content-Type':'application/json'},
      body:JSON.stringify({role:'reader',type:'anyone'})
    });
    return 'https://drive.google.com/uc?export=view&id='+data.id;
  } catch(e){console.error('img upload fail:',e);return '';}
}

// SAVE
async function saveRecord() {
  if(!authed){toast('로그인 필요');return;}
  showLoading(true);
  try {
    const type=curDetailType;
    const uploaded=[];
    for(const img of imgs){
      const url=await uploadImg(img);
      if(url) uploaded.push(url);
    }
    const sheetName = (type==='gourmet'||type==='matzip-detail-new') ? SHEETS.gourmet : SHEETS[type];

    if(type==='matzip') {
      const row=[val('f-가게명'),val('f-장소'),val('f-공슐랭'),val('f-하슐랭'),val('f-메뉴'),val('f-비고')];
      if(editRowIndex) await updateRow(SHEETS.matzip,editRowIndex,row);
      else await appendRow(SHEETS.matzip,row);
    }
    if(type==='gourmet'||type==='matzip-detail-new') {
      // 컬럼순서: 가게명,대표이미지,가격,날짜,해시태그,메뉴상세,사진1~15,메모
      const photos = uploaded.slice(1);
      while(photos.length < 15) photos.push('');
      const row=[val('f-가게명'),uploaded[0]||'',val('f-가격'),val('f-날짜'),val('f-해시태그'),val('f-메뉴상세'),...photos.slice(0,15),val('f-메모')];
      if(editRowIndex) await updateRow(SHEETS.gourmet,editRowIndex,row);
      else await appendRow(SHEETS.gourmet,row);
    }
    if(type==='date') {
      // 데이트 컬럼: 장소,날짜,대표이미지,한줄평,비고,구분,했던것,못한것,다음에갈곳,사진1~14
      const datePhotos = uploaded.slice(1);
      while(datePhotos.length < 14) datePhotos.push('');
      const row=[val('f-장소'),val('f-날짜'),uploaded[0]||'',val('f-한줄평'),'',val('f-구분'),val('f-했던것'),val('f-못한것'),val('f-다음에갈곳'),...datePhotos.slice(0,14)];
      if(editRowIndex) await updateRow(SHEETS.date,editRowIndex,row);
      else await appendRow(SHEETS.date,row);
    }
    if(type==='movie') {
      const row=[val('f-영화명'),val('f-날짜'),uploaded[0]||'',val('f-공슐랭'),val('f-하슐랭'),val('f-한줄평')];
      if(editRowIndex) await updateRow(SHEETS.movie,editRowIndex,row);
      else await appendRow(SHEETS.movie,row);
    }
    toast('저장됐어요 ✓');
    closeForm();
    await loadAll();
  } catch(e){toast('저장 실패: '+e.message);console.error(e);}
  showLoading(false);
}

function closeForm(){document.getElementById('fview').classList.remove('on');editRowIndex=null;imgs=[];}

function showLoading(show) {
  let el=document.getElementById('loading');
  if(show){
    if(!el){el=document.createElement('div');el.id='loading';el.className='loading';
      el.innerHTML='<div class="loading-spinner"></div><div class="loading-txt">처리 중...</div>';
      document.body.appendChild(el);}
    el.style.display='flex';
  } else {if(el)el.style.display='none';}
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),2500);
}
function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
